name: Daily YNAB Sync

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: ynab-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YNAB_ACCESS_TOKEN: ${{ secrets.YNAB_ACCESS_TOKEN }}
      BUDGET_ID: ${{ secrets.BUDGET_ID }}
      BANK_ACCOUNT: ${{ secrets.BANK_ACCOUNT }}
      BARAK_CARD: ${{ secrets.BARAK_CARD }}
      ADI_CARD: ${{ secrets.ADI_CARD }}
      CREDIT_CARD_USERNAME: ${{ secrets.CREDIT_CARD_USERNAME }}
      CREDIT_CARD_PASSWORD: ${{ secrets.CREDIT_CARD_PASSWORD }}
      DISCOUNT_ID: ${{ secrets.DISCOUNT_ID }}
      DISCOUNT_PASSWORD: ${{ secrets.DISCOUNT_PASSWORD }}
      DISCOUNT_NUM: ${{ secrets.DISCOUNT_NUM }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.puppeteer-cache

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/cache@v4
        with:
          path: .puppeteer-cache
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - run: mkdir -p reports

      - name: Sync bank (Discount)
        run: node scripts/sync-bank.js --days 30 --upload --json reports/bank.json

      - name: Sync cards (Max)
        run: node scripts/sync-cards.js --days 45 --upload --apply-deletes --json reports/cards.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
